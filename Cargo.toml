[package]
name = "qnsvoice"
version = "0.1.0"
edition = "2021"
authors = ["hpublish"]
description = "Queens voice/news platform"

[workspace]

[dependencies]
resightings-core = { path = "./core" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
axum = "0.7"
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres"] }
tracing = "0.1"
tracing-subscriber = "0.3"
toml = "0.8"

[[bin]]
name = "qnsvoice"
path = "src/main.rs"
