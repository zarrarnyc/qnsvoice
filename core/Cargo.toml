[package]
name = "resightings-core"
version = "1.0.0"
edition = "2021"
authors = ["hpublish"]
description = "Core framework for Re-sightings platform"

[lib]
name = "resightings_core"
path = "src/lib.rs"

[dependencies]
# Web framework
axum = { version = "0.7", features = ["macros"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["fs", "cors"] }
tokio = { version = "1", features = ["full"] }

# Database
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Auth & Crypto
jsonwebtoken = "9"
bcrypt = "0.15"
aes-gcm = "0.10"
base64 = "0.22"

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
thiserror = "1.0"
async-trait = "0.1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = "0.3"

# Caching
redis = { version = "0.25", features = ["tokio-comp"] }

[dev-dependencies]
tokio-test = "0.4"
